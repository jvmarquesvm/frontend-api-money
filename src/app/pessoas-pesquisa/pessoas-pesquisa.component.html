<div class="container">
  <div class="grid">
    <div class="col-12">
      <h1>Pessoas</h1>
    </div>
    <div class="col-12">
      <label>Nome</label>
      <input type="text" pInputText fluid>
    </div>
    <div class="col-12">
      <p-button label="Pesquisar" />
    </div>
  </div>
  <div class="grid">
    <div class="col-12">
      <p-table [value]="pessoas" [paginator]="true" [rows]="3" [tableStyle]="{ 'min-width': '50rem' }" [rowsPerPageOptions]="[2, 3]">>
        <ng-template #header>
          <tr>
            <th>Nome</th>
            <th>Cidade</th>
            <th class="col-valor-header">Estado</th>
            <th class="col-valor-header">Status</th>
            <th class="col-valor-header"></th>
          </tr>
        </ng-template>
        <ng-template #body let-pessoa>
          <tr>
            <td class="">{{ pessoa.nome }}</td>
            <td class="">{{ pessoa.cidade }}</td>
            <td class="">{{ pessoa.estado }}</td>
            <td class="">{{ pessoa.ativo === true ? 'Ativo' : 'Inativo' }}</td>
            <td class="col-acoes col-data-content"> <a href="#"><p-button icon="pi pi-pencil" pTooltip="Editar" tooltipPosition="top" /></a>
              <a href="#"><p-button icon="pi pi-trash" pTooltip="Excluir" tooltipPosition="top" /></a>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
    <div class="col-12">
      <p-button label="Nova Pesquisa" />
    </div>
  </div>
</div>
